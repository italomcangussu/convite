services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.production}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env.production}
        SITE_URL: ${SITE_URL:?Set SITE_URL in .env.production}
    image: convite:latest
    container_name: convite
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env.production}
